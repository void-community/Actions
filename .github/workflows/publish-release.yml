on:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: true
    outputs:
      release:
        description: "Release Created"
        value: ${{ jobs.release-please.outputs.release_created == 'true' }}
      version:
        description: "Release Version"
        value: ${{ jobs.release-please.outputs.version }}

jobs:
  # The job runs for every repository, since a skipped job would skip every job after it; only its steps depend on the input
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ inputs.release }}

      - name: Create Release
        if: ${{ inputs.release }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ github.token }}
          config-file: .github/RELEASE_PLEASE/config.json
          manifest-file: .github/RELEASE_PLEASE/manifest.json
