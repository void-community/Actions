on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
        default: 'latest'
      version:
        type: string
        required: false
        default: ''
      publish:
        type: string
        required: true
      runtimes:
        type: string
        required: true

jobs:
  publish:
    name: publish (${{ matrix.runtime-identifier }})
    env:
      Version: ${{ inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.runtimes) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        if: ${{ !matrix.alpine }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          dotnet-quality: ${{ inputs.dotnet-version == 'latest' && 'preview' || '' }}

      - name: Install Linux Prerequisites
        if: ${{ runner.os == 'Linux' && !matrix.alpine }}
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Install ARM Prerequisites
        if: ${{ matrix.runtime-identifier == 'linux-arm' }}
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y libc6-dev:armhf libstdc++-13-dev:armhf gcc-arm-linux-gnueabihf

      - name: Publish
        if: ${{ !matrix.alpine }}
        shell: bash
        run: |
          for project in ${{ inputs.publish }}; do
            dotnet publish $project --configuration Release --runtime ${{ matrix.runtime-identifier }} --output publish/$(basename $project .csproj)
          done

      # A native musl binary has to be linked on musl
      - name: Publish in Alpine
        if: ${{ matrix.alpine }}
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace \
            --env Version \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine \
            sh -c 'apk add --no-cache clang build-base zlib-dev && \
                   for project in ${{ inputs.publish }}; do \
                     dotnet publish $project \
                     --configuration Release \
                     --runtime ${{ matrix.runtime-identifier }} \
                     --output publish/$(basename $project .csproj); \
                   done'

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: publish-${{ matrix.runtime-identifier }}
          path: publish
          if-no-files-found: error

  compress:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: publish-*
          path: artifacts

      - name: Compress Executables
        run: |
          mkdir archives

          for directory in artifacts/publish-*/*; do
            project=$(basename $directory)
            runtime_identifier=$(basename $(dirname $directory))
            runtime_identifier=${runtime_identifier#publish-}

            filter="--x86"
            if [[ "$runtime_identifier" == *"arm64"* ]]; then
              filter="--arm64"
            elif [[ "$runtime_identifier" == *"arm"* ]]; then
              filter="--arm"
            fi

            # Artifacts do not preserve file permissions, so the executables get theirs back
            find $directory -maxdepth 1 -type f ! -name '*.*' -exec chmod +x {} +

            env XZ_OPT="$filter -9e -T0" tar -cJf "archives/$project-$runtime_identifier.tar.xz" --exclude='*.pdb' --exclude='*.dbg' --exclude='*.dSYM' -C "$directory" .
          done

      - name: Upload Compressed Archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compressed
          path: archives/*.tar.xz
          if-no-files-found: error
