on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
        default: 'latest'
      version:
        type: string
        required: false
        default: ''
      runtimes:
        type: string
        required: true
      check-formatting:
        type: boolean
        required: false
        default: true
      shards:
        type: number
        required: false
        default: 8
      linux-packages:
        type: string
        required: false
        default: ''
      packed:
        type: boolean
        required: false
        default: false
      published:
        type: boolean
        required: false
        default: false

jobs:
  # Every test class goes to a shard in turn. Shard 0 runs whatever the other shards do not, so a test that the list misses still runs.
  shards:
    env:
      Version: ${{ inputs.version }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Pack Artifacts
        if: ${{ inputs.packed }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packages
          path: artifacts/packages

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          dotnet-quality: ${{ inputs.dotnet-version == 'latest' && 'preview' || '' }}

      - name: Build
        run: dotnet build --configuration Release

      # The SDK lists tests for Microsoft.Testing.Platform only when the test projects use it; otherwise VSTest runs them
      - name: Find test runner
        shell: bash
        run: |
          if DOTNET_TEST_RUNNER=Microsoft.Testing.Platform dotnet test --configuration Release --no-build --list-tests > /dev/null 2>&1; then
            echo "DOTNET_TEST_RUNNER=Microsoft.Testing.Platform" >> $GITHUB_ENV
          fi

      - name: List test classes
        shell: bash
        run: dotnet test --configuration Release --no-build --list-tests | sed -nE 's/^\s+([A-Za-z_][A-Za-z0-9_.+]*)\.[A-Za-z_][A-Za-z0-9_]*(\(.*)?$/\1/p' | sort -u > classes.txt

      - name: Split test classes
        id: matrix
        run: |
          matrix=$(jq -Rnc --argjson shards ${{ inputs.shards }} '
            [inputs] | to_entries | map({shard: (.key % $shards), term: "FullyQualifiedName~\(.value)."}) as $terms
            | [range(1; $shards) as $shard | {index: $shard, filter: ($terms | map(select(.shard == $shard).term) | join("|"))} | select(.filter != "")] as $others
            | [{index: 0, filter: ($terms | map(select(.shard != 0).term | sub("~"; "!~")) | join("&"))}] + $others
          ' classes.txt)

          echo "result=$matrix" >> $GITHUB_OUTPUT

  # Every runtime tests itself: on its runner, as x86 on Windows, or in a container of the runtime where no runner runs it
  tests:
    needs: shards
    name: tests (${{ matrix.runtime.runtime-identifier }}, ${{ matrix.shard.index }})
    env:
      Version: ${{ inputs.version }}
      FILTER: ${{ matrix.shard.filter }}
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(inputs.runtimes) }}
        shard: ${{ fromJSON(needs.shards.outputs.matrix) }}
    runs-on: ${{ matrix.runtime.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # What the run packed, published and bundled, for tests that use those very files
      - name: Download Pack Artifacts
        if: ${{ inputs.packed }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packages
          path: artifacts/packages

      - name: Download Build Artifacts
        if: ${{ inputs.published }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: publish-*
          path: artifacts

      - name: Download Bundle
        if: ${{ inputs.published }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bundle
          path: artifacts/bundle

      # Artifacts do not preserve file permissions, so the executables get theirs back
      - name: Restore Permissions
        if: ${{ inputs.published }}
        shell: bash
        run: find artifacts -type f ! -name '*.*' -exec chmod +x {} +

      - name: Setup .NET
        if: ${{ !matrix.runtime.test-image }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          dotnet-quality: ${{ inputs.dotnet-version == 'latest' && 'preview' || '' }}
          architecture: ${{ matrix.runtime.architecture }}

      - name: Install Linux Prerequisites
        if: ${{ runner.os == 'Linux' && !matrix.runtime.test-image }}
        run: sudo apt-get update && sudo apt-get install -y clang lld zlib1g-dev ${{ inputs.linux-packages }}

      - name: Build
        if: ${{ !matrix.runtime.test-image }}
        run: dotnet build --configuration Release

      # A build that rewrites sources, as NetAgents does, means the commit was not formatted
      - name: Check formatting
        if: ${{ inputs.check-formatting && runner.os == 'Linux' && !matrix.runtime.test-image }}
        run: git diff --exit-code

      # The SDK lists tests for Microsoft.Testing.Platform only when the test projects use it; otherwise VSTest runs them
      - name: Find test runner
        if: ${{ !matrix.runtime.test-image }}
        shell: bash
        run: |
          if DOTNET_TEST_RUNNER=Microsoft.Testing.Platform dotnet test --configuration Release --no-build --list-tests > /dev/null 2>&1; then
            echo "DOTNET_TEST_RUNNER=Microsoft.Testing.Platform" >> $GITHUB_ENV
          fi

      - name: Run tests
        if: ${{ !matrix.runtime.test-image && matrix.shard.filter == '' }}
        run: dotnet test --configuration Release --no-build

      - name: Run shard
        if: ${{ !matrix.runtime.test-image && matrix.shard.filter != '' }}
        shell: bash
        run: dotnet test --configuration Release --no-build --filter "$FILTER"

      # The container builds and tests as the steps above do, with the Docker of the runner for tests that start containers themselves. The image
      # holds the runtime of its SDK alone, so tests that target an older .NET run on that one
      - name: Run Tests In Container
        if: ${{ matrix.runtime.test-image }}
        run: |
          docker run --rm ${{ matrix.runtime.test-platform && format('--platform {0}', matrix.runtime.test-platform) || '' }} \
            --volume "${{ github.workspace }}:/workspace" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --workdir /workspace \
            --env Version --env FILTER --env CI --env DOTNET_ROLL_FORWARD=Major \
            ${{ matrix.runtime.test-image }} \
            sh -c '${{ matrix.runtime.test-setup }} && \
                   dotnet build --configuration Release && \
                   if DOTNET_TEST_RUNNER=Microsoft.Testing.Platform dotnet test --configuration Release --no-build --list-tests > /dev/null 2>&1; then export DOTNET_TEST_RUNNER=Microsoft.Testing.Platform; fi && \
                   dotnet test --configuration Release --no-build ${FILTER:+--filter "$FILTER"}'
