on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
        default: 'latest'
      version:
        type: string
        required: false
        default: ''
      timestamp:
        type: string
        required: false
        default: ''
      operating-systems:
        type: string
        required: true

jobs:
  tests:
    env:
      Version: ${{ inputs.version }}
      VersionTimestamp: ${{ inputs.timestamp }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.operating-systems) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          dotnet-quality: ${{ inputs.dotnet-version == 'latest' && 'preview' || '' }}

      - name: Build
        run: dotnet build --configuration Release

      - name: Run tests
        run: dotnet test --configuration Release --no-build
