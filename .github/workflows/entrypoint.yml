on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
        default: 'latest'
      version:
        type: string
        required: false
        default: ''
      operating-systems:
        type: string
        required: false
        default: '["ubuntu-24.04-arm", "ubuntu-latest", "macos-latest", "macos-15-intel", "windows-11-arm", "windows-latest"]'
      check-formatting:
        type: boolean
        required: false
        default: true
      shards:
        type: number
        required: false
        default: 8
      pack:
        type: string
        required: false
        default: ''
      publish:
        type: string
        required: false
        default: ''
      bundle:
        type: string
        required: false
        default: ''
      linux-packages:
        type: string
        required: false
        default: ''
      container:
        type: string
        required: false
        default: ''
    secrets:
      RENOVATE_TOKEN:
        required: false
    outputs:
      nuget:
        description: "Packages To Push"
        value: ${{ jobs.pack.result == 'success' && (jobs.release.outputs.release == 'true' || (inputs.version == 'timestamp' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch)) }}

jobs:
  # The schedule is Renovate's; every other event builds, tests and publishes
  matrix:
    if: ${{ github.event_name != 'schedule' }}
    uses: $/.github/workflows/dotnet-matrix.yml
    with:
      operating-systems: ${{ inputs.operating-systems }}

  release:
    needs: matrix
    uses: $/.github/workflows/publish-release.yml
    with:
      release: ${{ inputs.version == 'release-please' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}

  version:
    needs: release
    uses: $/.github/workflows/dotnet-version.yml
    with:
      version: ${{ inputs.version }}
      release-version: ${{ needs.release.outputs.version }}

  pack:
    needs: version
    if: ${{ inputs.pack != '' }}
    uses: $/.github/workflows/dotnet-pack.yml
    with:
      dotnet-version: ${{ inputs.dotnet-version }}
      version: ${{ needs.version.outputs.version }}
      pack: ${{ inputs.pack }}
      linux-packages: ${{ inputs.linux-packages }}

  # The build comes after the packing, which a repository that packs nothing skips, and a skipped job would skip the build too, so it says itself
  # when it runs
  build:
    needs: [matrix, version, pack]
    if: ${{ !failure() && !cancelled() && needs.version.result == 'success' && inputs.publish != '' && needs.matrix.outputs.runtimes != '[]' }}
    uses: $/.github/workflows/dotnet-build.yml
    with:
      dotnet-version: ${{ inputs.dotnet-version }}
      version: ${{ needs.version.outputs.version }}
      publish: ${{ inputs.publish }}
      runtimes: ${{ needs.matrix.outputs.runtimes }}
      linux-packages: ${{ inputs.linux-packages }}
      packed: ${{ needs.pack.result == 'success' }}

  bundle:
    needs: [version, build]
    uses: $/.github/workflows/dotnet-bundle.yml
    with:
      dotnet-version: ${{ inputs.dotnet-version }}
      version: ${{ needs.version.outputs.version }}
      publish: ${{ inputs.publish }}
      bundle: ${{ inputs.bundle }}

  # A repository with nothing to build has nothing to test. The tests come after the packing and the build, which a repository that packs or
  # publishes nothing skips, and a skipped job would skip them too, so they say themselves when they run
  test:
    needs: [matrix, version, pack, build, bundle]
    if: ${{ !failure() && !cancelled() && needs.version.result == 'success' && needs.matrix.outputs.solution == 'true' }}
    uses: $/.github/workflows/dotnet-test.yml
    with:
      dotnet-version: ${{ inputs.dotnet-version }}
      version: ${{ needs.version.outputs.version }}
      runtimes: ${{ needs.matrix.outputs.runtimes }}
      check-formatting: ${{ inputs.check-formatting }}
      shards: ${{ inputs.shards }}
      linux-packages: ${{ inputs.linux-packages }}
      packed: ${{ needs.pack.result == 'success' }}
      published: ${{ needs.bundle.result == 'success' }}

  # The tests may have been skipped, which would skip what publishes after them too
  docker:
    needs: [matrix, version, build, test]
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' && inputs.container != '' && needs.matrix.outputs.containers != '[]' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
    uses: $/.github/workflows/publish-docker.yml
    with:
      dotnet-version: ${{ inputs.dotnet-version }}
      version: ${{ needs.version.outputs.version }}
      projects: ${{ inputs.publish }}
      repositories: ${{ inputs.container }}
      runtimes: ${{ needs.matrix.outputs.containers }}

  github:
    needs: [release, version, bundle, test]
    if: ${{ !failure() && !cancelled() && needs.bundle.result == 'success' && (needs.release.outputs.release == 'true' || (inputs.version == 'timestamp' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch)) }}
    uses: $/.github/workflows/publish-github.yml
    with:
      tag: ${{ needs.release.outputs.tag || format('v{0}', needs.version.outputs.version) }}
      created: ${{ needs.release.outputs.release == 'true' }}

  # The one check to require in branch protection, since the jobs above come and go with the inputs
  required:
    needs: [matrix, release, version, pack, build, bundle, test]
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check Results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.version.result != 'success' }}
        run: exit 1

  renovate:
    if: ${{ github.event_name == 'schedule' }}
    uses: $/.github/workflows/maintenance-renovate.yml
    secrets:
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
