on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
        default: 'latest'
      version:
        type: string
        required: false
        default: ''
      operating-systems:
        type: string
        required: false
        default: '["ubuntu-24.04-arm", "ubuntu-latest", "macos-latest", "macos-15-intel", "windows-11-arm", "windows-latest"]'
      check-formatting:
        type: boolean
        required: false
        default: true
      pack:
        type: string
        required: false
        default: ''
      publish:
        type: string
        required: false
        default: ''
      container:
        type: string
        required: false
        default: ''
    secrets:
      RENOVATE_TOKEN:
        required: false
    outputs:
      nuget:
        description: "Packages To Push"
        value: ${{ inputs.pack != '' && jobs.version.outputs.release == 'true' }}

jobs:
  # The schedule is Renovate's; every other event builds, tests and publishes
  version:
    if: ${{ github.event_name != 'schedule' }}
    uses: $/.github/workflows/dotnet-version.yml
    with:
      version: ${{ inputs.version }}
      release: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}

  build:
    needs: version
    uses: $/.github/workflows/dotnet-build.yml
    with:
      dotnet-version: ${{ inputs.dotnet-version }}
      version: ${{ needs.version.outputs.version }}
      timestamp: ${{ needs.version.outputs.timestamp }}
      pack: ${{ inputs.pack }}
      publish: ${{ inputs.publish }}

  # A repository with nothing to build has nothing to test
  test:
    needs: version
    if: ${{ needs.version.outputs.solution == 'true' }}
    uses: $/.github/workflows/dotnet-test.yml
    with:
      dotnet-version: ${{ inputs.dotnet-version }}
      version: ${{ needs.version.outputs.version }}
      timestamp: ${{ needs.version.outputs.timestamp }}
      operating-systems: ${{ inputs.operating-systems }}
      check-formatting: ${{ inputs.check-formatting }}

  docker:
    needs: [version, build, test]
    if: ${{ inputs.container != '' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
    uses: $/.github/workflows/publish-docker.yml
    with:
      dotnet-version: ${{ inputs.dotnet-version }}
      version: ${{ needs.version.outputs.version }}
      timestamp: ${{ needs.version.outputs.timestamp }}
      projects: ${{ inputs.publish }}
      repositories: ${{ inputs.container }}

  # The one check to require in branch protection, since the jobs above come and go with the inputs
  required:
    needs: [version, build, test]
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check Results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  renovate:
    if: ${{ github.event_name == 'schedule' }}
    uses: $/.github/workflows/maintenance-renovate.yml
    secrets:
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
