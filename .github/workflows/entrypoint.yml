on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
        default: 'latest'
      version:
        type: string
        required: false
        default: ''
      operating-systems:
        type: string
        required: false
        default: '["ubuntu-24.04-arm", "ubuntu-latest", "macos-latest", "macos-15-intel", "windows-11-arm", "windows-latest"]'
      check-formatting:
        type: boolean
        required: false
        default: true
      shards:
        type: number
        required: false
        default: 8
      pack:
        type: string
        required: false
        default: ''
      publish:
        type: string
        required: false
        default: ''
      bundle:
        type: string
        required: false
        default: ''
      release:
        type: boolean
        required: false
        default: true
      linux-packages:
        type: string
        required: false
        default: ''
      container:
        type: string
        required: false
        default: ''
    secrets:
      RENOVATE_TOKEN:
        required: false
    outputs:
      nuget:
        description: "Packages To Push"
        value: ${{ inputs.pack != '' && jobs.version.outputs.release == 'true' }}

jobs:
  # The schedule is Renovate's; every other event builds, tests and publishes
  version:
    if: ${{ github.event_name != 'schedule' }}
    uses: $/.github/workflows/dotnet-version.yml
    with:
      version: ${{ inputs.version }}

  build:
    needs: version
    uses: $/.github/workflows/dotnet-build.yml
    with:
      dotnet-version: ${{ inputs.dotnet-version }}
      version: ${{ needs.version.outputs.version }}
      operating-systems: ${{ inputs.operating-systems }}
      pack: ${{ inputs.pack }}
      publish: ${{ inputs.publish }}
      bundle: ${{ inputs.bundle }}
      linux-packages: ${{ inputs.linux-packages }}

  # A repository without a solution has nothing to test, and nothing is published without the tests
  test:
    needs: [version, build]
    if: ${{ needs.build.outputs.solution == 'true' }}
    uses: $/.github/workflows/dotnet-test.yml
    with:
      dotnet-version: ${{ inputs.dotnet-version }}
      version: ${{ needs.version.outputs.version }}
      runtimes: ${{ needs.build.outputs.runtimes }}
      check-formatting: ${{ inputs.check-formatting }}
      shards: ${{ inputs.shards }}
      linux-packages: ${{ inputs.linux-packages }}
      packed: ${{ inputs.pack != '' }}
      published: ${{ inputs.publish != '' }}

  docker:
    needs: [version, build, test]
    if: ${{ inputs.container != '' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
    uses: $/.github/workflows/publish-docker.yml
    with:
      dotnet-version: ${{ inputs.dotnet-version }}
      version: ${{ needs.version.outputs.version }}
      projects: ${{ inputs.publish }}
      repositories: ${{ inputs.container }}
      runtimes: ${{ needs.build.outputs.containers }}

  github:
    needs: [version, build, test]
    if: ${{ inputs.publish != '' && inputs.release && needs.version.outputs.release == 'true' }}
    uses: $/.github/workflows/publish-github.yml
    with:
      tag: ${{ needs.version.outputs.tag || format('v{0}', needs.version.outputs.version) }}
      created: ${{ needs.version.outputs.tag != '' }}

  # A manual run doesn't wait for the hour
  renovate:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    uses: $/.github/workflows/maintenance-renovate.yml
    secrets:
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
