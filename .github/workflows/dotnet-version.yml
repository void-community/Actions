on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
      release:
        type: boolean
        required: false
        default: false
      operating-systems:
        type: string
        required: true
    outputs:
      runtimes:
        description: "Runtimes Of The Operating Systems"
        value: ${{ jobs.dev.outputs.runtimes }}
      containers:
        description: "Runtimes That Have A Container Image"
        value: ${{ jobs.dev.outputs.containers }}
      version:
        description: "Generated Version"
        value: ${{ jobs.release-please.outputs.version || jobs.dev.outputs.fallback-version }}
      timestamp:
        description: "Generated Version Timestamp"
        value: ${{ jobs.dev.outputs.timestamp }}
      solution:
        description: "Solution Found"
        value: ${{ jobs.dev.outputs.solution }}
      release:
        description: "Release Created"
        value: ${{ jobs.release-please.outputs.release_created == 'true' || (inputs.version == 'timestamp' && inputs.release) }}

jobs:
  dev:
    env:
      # Every runtime, the runner that builds it and the tag of its container image. The operating systems of a repository pick the rows
      RUNTIMES: >-
        [
          { "os": "windows-latest",   "runtime-identifier": "win-x64",          "tag": "windows", "base-image": "mcr.microsoft.com/dotnet/runtime:10.0-nanoserver-ltsc2025" },
          { "os": "windows-11-arm",   "runtime-identifier": "win-arm64" },
          { "os": "windows-latest",   "runtime-identifier": "win-x86" },
          { "os": "macos-latest",     "runtime-identifier": "osx-arm64" },
          { "os": "macos-15-intel",   "runtime-identifier": "osx-x64" },
          { "os": "ubuntu-latest",    "runtime-identifier": "linux-x64",        "tag": "linux-x64" },
          { "os": "ubuntu-24.04-arm", "runtime-identifier": "linux-arm64",      "tag": "linux-arm64" },
          { "os": "ubuntu-24.04-arm", "runtime-identifier": "linux-arm",        "tag": "linux-arm" },
          { "os": "ubuntu-latest",    "runtime-identifier": "linux-musl-x64",   "tag": "alpine-x64",   "alpine": true },
          { "os": "ubuntu-24.04-arm", "runtime-identifier": "linux-musl-arm64", "tag": "alpine-arm64", "alpine": true }
        ]
    runs-on: ubuntu-latest
    outputs:
      fallback-version: ${{ steps.fallback-version.outputs.result }}
      timestamp: ${{ steps.timestamp.outputs.result }}
      solution: ${{ steps.solution.outputs.result }}
      runtimes: ${{ steps.runtimes.outputs.result }}
      containers: ${{ steps.containers.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select runtimes
        id: runtimes
        run: echo "result=$(jq -c --argjson os '${{ inputs.operating-systems }}' '[.[] | select(.os as $runner | $os | index($runner))]' <<< "$RUNTIMES")" >> $GITHUB_OUTPUT

      - name: Select containers
        id: containers
        run: echo "result=$(jq -c '[.[] | select(.tag)]' <<< '${{ steps.runtimes.outputs.result }}')" >> $GITHUB_OUTPUT

      - name: Find solution
        id: solution
        run: echo "result=${{ hashFiles('*.sln', '*.slnx', '*.csproj') != '' }}" >> $GITHUB_OUTPUT

      - name: Set fallback version
        id: fallback-version
        if: ${{ inputs.version == 'release-please' }}
        run: |
          base=$(jq -r '.["."]' .github/RELEASE_PLEASE/manifest.json)
          sha=$(git rev-parse --short HEAD)
          echo "result=${base}+${sha}" >> $GITHUB_OUTPUT

      # Set once, so every job builds the same version from it.
      - name: Set version timestamp
        id: timestamp
        if: ${{ inputs.version == 'timestamp' }}
        run: echo "result=$(date -u '+%y %m %d %H %M %S')" >> $GITHUB_OUTPUT

  release-please:
    if: ${{ inputs.version == 'release-please' && inputs.release }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create Release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ github.token }}
          config-file: .github/RELEASE_PLEASE/config.json
          manifest-file: .github/RELEASE_PLEASE/manifest.json
