on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
        default: 'latest'
      version:
        type: string
        required: false
        default: ''
    outputs:
      dotnet:
        description: ".NET SDK"
        value: ${{ jobs.dev.outputs.dotnet }}
      version:
        description: "Generated Version"
        value: ${{ jobs.release-please.outputs.version || jobs.dev.outputs.version }}
      # A release that release-please created, or with timestamps every run of the default branch
      release:
        description: "Release Run"
        value: ${{ jobs.release-please.outputs.release_created == 'true' || (inputs.version == 'timestamp' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch) }}
      tag:
        description: "Release Tag"
        value: ${{ jobs.release-please.outputs.tag_name }}

jobs:
  dev:
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.latest-dotnet.outputs.result || inputs.dotnet-version }}
      version: ${{ steps.fallback-version.outputs.result || steps.timestamp-version.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The newest .NET there is, whether that is a preview or a release
      - name: Find latest .NET
        id: latest-dotnet
        if: ${{ inputs.dotnet-version == 'latest' }}
        run: echo "result=$(curl -s https://builds.dotnet.microsoft.com/dotnet/release-metadata/releases-index.json | jq -r '.["releases-index"] | max_by(.["channel-version"] | tonumber) | .["latest-sdk"]')" >> $GITHUB_OUTPUT

      - name: Set fallback version
        id: fallback-version
        if: ${{ inputs.version == 'release-please' }}
        run: |
          base=$(jq -r '.["."]' .github/RELEASE_PLEASE/manifest.json)
          sha=$(git rev-parse --short HEAD)
          echo "result=${base}+${sha}" >> $GITHUB_OUTPUT

      # The date, and the time of day as a number from 1000 to 9999
      - name: Set timestamp version
        id: timestamp-version
        if: ${{ inputs.version == 'timestamp' }}
        run: |
          now=$(date -u +%s)
          echo "result=$(date -u -d @$now '+%y.%-m.%-d').$((1000 + now % 86400 * 9000 / 86400))" >> $GITHUB_OUTPUT

  release-please:
    if: ${{ inputs.version == 'release-please' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create Release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ github.token }}
          config-file: .github/RELEASE_PLEASE/config.json
          manifest-file: .github/RELEASE_PLEASE/manifest.json
