on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
        default: 'latest'
      version:
        type: string
        required: false
        default: ''
      publish:
        type: string
        required: true
      bundle:
        type: string
        required: false
        default: ''

jobs:
  bundle:
    env:
      Version: ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Build Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: publish-*
          path: artifacts

      # Artifacts do not preserve file permissions, so the executables get theirs back
      - name: Restore Permissions
        run: find artifacts -type f ! -name '*.*' -exec chmod +x {} +

      - name: Compress Executables
        if: ${{ inputs.bundle == '' }}
        run: |
          mkdir bundle

          for directory in artifacts/publish-*/*; do
            project=$(basename $directory)
            runtime_identifier=$(basename $(dirname $directory))
            runtime_identifier=${runtime_identifier#publish-}

            filter="--x86"
            if [[ "$runtime_identifier" == *"arm64"* ]]; then
              filter="--arm64"
            elif [[ "$runtime_identifier" == *"arm"* ]]; then
              filter="--arm"
            fi

            env XZ_OPT="$filter -9e -T0" tar -cJf "bundle/$project-$runtime_identifier.tar.xz" --exclude='*.pdb' --exclude='*.dbg' --exclude='*.dSYM' -C "$directory" .
          done

      - name: Setup .NET
        if: ${{ inputs.bundle != '' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          dotnet-quality: ${{ inputs.dotnet-version == 'latest' && 'preview' || '' }}

      # A project that names a target makes its own files from the output of every runtime
      - name: Bundle
        if: ${{ inputs.bundle != '' }}
        run: |
          for project in ${{ inputs.publish }}; do
            dotnet msbuild $project -restore -target:${{ inputs.bundle }} -property:RuntimesDirectory=$PWD/artifacts -property:BundleDirectory=$PWD/bundle
          done

      - name: Upload Bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bundle
          path: bundle
          if-no-files-found: error
