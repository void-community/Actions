on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
        default: 'latest'
      version:
        type: string
        required: false
        default: ''
      projects:
        type: string
        required: true
      repositories:
        type: string
        required: true
      runtimes:
        type: string
        required: true

jobs:
  push:
    name: push (${{ matrix.tag }})
    env:
      Version: ${{ inputs.version }}
      ContainerRegistry: ghcr.io
      ContainerImageTags: latest-${{ matrix.tag }}
      ContainerBaseImage: ${{ matrix.base-image }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.runtimes) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        if: ${{ !matrix.alpine }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          dotnet-quality: ${{ inputs.dotnet-version == 'latest' && 'preview' || '' }}

      - name: Login to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install Linux Prerequisites
        if: ${{ runner.os == 'Linux' && !matrix.alpine }}
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Install ARM Prerequisites
        if: ${{ matrix.runtime-identifier == 'linux-arm' }}
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y libc6-dev:armhf libstdc++-13-dev:armhf gcc-arm-linux-gnueabihf

      # The repositories pair with the projects by position
      - name: Publish Container
        if: ${{ !matrix.alpine }}
        shell: bash
        run: |
          projects=(${{ inputs.projects }})
          repositories=(${{ inputs.repositories }})

          for index in "${!repositories[@]}"; do
            ContainerRepository=${repositories[index]} dotnet publish ${projects[index]} --configuration Release -t:PublishContainer -p:RuntimeIdentifier=${{ matrix.runtime-identifier }}
          done

      # A native musl binary has to be linked on musl
      - name: Publish Container in Alpine
        if: ${{ matrix.alpine }}
        run: |
          projects=(${{ inputs.projects }})
          repositories=(${{ inputs.repositories }})

          for index in "${!repositories[@]}"; do
            docker run --rm \
              --volume "${{ github.workspace }}:/workspace" \
              --volume "$HOME/.docker:/root/.docker:ro" \
              --workdir /workspace \
              --env Version \
                --env ContainerRegistry \
              --env ContainerImageTags \
              --env ContainerRepository=${repositories[index]} \
              mcr.microsoft.com/dotnet/sdk:10.0-alpine \
              sh -c "apk add --no-cache clang build-base zlib-dev && \
                     dotnet publish ${projects[index]} \
                     --configuration Release \
                     -t:PublishContainer \
                     -p:RuntimeIdentifier=${{ matrix.runtime-identifier }}"
          done

  manifest:
    needs: push
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create and Push Manifests
        env:
          RUNTIMES: ${{ inputs.runtimes }}
        run: |
          for repository in ${{ inputs.repositories }}; do
            image=ghcr.io/$repository

            docker manifest create $image:latest $(jq -r --arg image $image '.[] | "\($image):latest-\(.tag)"' <<< "$RUNTIMES")
            docker manifest push $image:latest
          done
