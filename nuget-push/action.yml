name: NuGet Push
description: Pushes the packages of the run to nuget.org with trusted publishing.
inputs:
  user:
    description: The nuget.org user name that owns the trusted publishing policy.
    required: false
    default: caunt
runs:
  using: composite
  steps:
    - name: Download Pack Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: packages
        path: artifacts

    - name: NuGet Login
      id: login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ inputs.user }}

    - name: NuGet Push
      shell: bash
      run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
